# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e8fco.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E8FCO AMOLED Panel

maintainers:
  - Kamil Gołda <kamil.golda@protonmail.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,s6e8fco

  reg:
    maxItems: 1

  vddio-supply: true
  ldo-supply: true
  iovcc-supply: true
  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vddio-supply
  - ldo-supply
  - iovcc-supply
  - port
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e8fco";
            reg = <0>;

            vddio-supply = <&vreg_l9a>;
            ldo-supply = <&panel_ldo_supply>;
            iovcc-supply = <&panel_iovcc_supply>;

            reset-gpios = <&tlmm 90 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
